services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped

    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend

    container_name: backend_quizo
    restart: unless-stopped

    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/quizo
      PORT: 3000
      
    depends_on:
      - mongodb

volumes:
  mongodb_data: